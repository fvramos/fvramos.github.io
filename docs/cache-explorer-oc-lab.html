<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cache Explorer — array, stride and cache</title>
<style>
:root{color-scheme:light;--bg:#f5f7fa;--panel:#fff;--ink:#192b3d;--muted:#586a7a;--edge:#d8e0e8;--hit:#087c6a;--miss:#b14d16;--active:#2359c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:28px;margin:0}h2{font-size:19px;margin:0 0 8px}p{margin:8px 0}.intro{color:var(--muted);max-width:950px}.controls,.transport,.presets{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:18px 0}label{display:flex;flex-direction:column;gap:4px;font-size:13px}select,button,input{font:inherit}select,button{padding:9px 12px;border:1px solid var(--edge);border-radius:7px;background:white;color:var(--ink)}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--active);color:white;border-color:var(--active)}button:focus-visible,select:focus-visible{outline:3px solid #c4a032;outline-offset:2px}.presets button{font-size:13px}.panel{background:var(--panel);padding:18px;border:1px solid var(--edge);border-radius:10px}.scene{display:grid;grid-template-columns:minmax(300px,1fr) minmax(440px,1.25fr);gap:42px;position:relative;align-items:start}.scene>section{min-width:0}.memory{display:grid;gap:6px;max-height:590px;overflow:auto;padding:4px}.block{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:6px;padding:4px;border:1px solid transparent;border-radius:5px}.block.resident{background:#e7f3ef}.block.target{border:2px solid var(--active);background:#eaf0ff}.bytes{display:grid;grid-template-columns:repeat(var(--b),minmax(0,1fr));gap:3px}.byte{display:flex;flex-direction:column;text-align:center;min-width:24px;background:#edf1f5;border-radius:3px;padding:4px 1px;font-variant-numeric:tabular-nums}.byte small{font-size:10px;color:var(--muted)}.byte strong{font-weight:500}.byte.current{background:var(--active);color:#fff}.byte.current small{color:#fff}.byte.next{outline:2px solid var(--active)}.small{font-size:12px;color:var(--muted)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--edge)}th{color:var(--muted);font-weight:500}tr.selected{background:#eaf0ff}td.linebytes{min-width:155px}.badge{padding:3px 7px;border-radius:4px;background:#edf1f5;white-space:nowrap}.dirty{color:#9b4313}.status{margin:16px 0;display:grid;grid-template-columns:140px 1fr;gap:15px;border-left:5px solid var(--active);min-height:88px}.status.hit{border-left-color:var(--hit)}.status.miss{border-left-color:var(--miss)}#phase{font-size:19px;font-weight:600}#detail{margin:0}.metrics{display:flex;flex-wrap:wrap;gap:24px;font-variant-numeric:tabular-nums}.metrics strong{font-size:21px;display:block}.flow{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;overflow:visible}.flow path{stroke:var(--active);stroke-width:3;fill:none;stroke-dasharray:7 5;animation:travel .6s linear infinite}.flow path.writeback{stroke:var(--miss)}@keyframes travel{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.flow path{animation:none}}details{margin-top:18px}summary{cursor:pointer;font-weight:600}code{background:#edf1f5;padding:2px 4px;border-radius:3px}#trace{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.below{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:12px}.key{display:inline-block;width:12px;height:12px;margin-right:5px;background:#e7f3ef;border:1px solid #aacfc2}.key.blue{background:#2359c4;border-color:#2359c4}@media(max-width:850px){main{padding:14px}.scene{grid-template-columns:1fr;gap:18px}.below{grid-template-columns:1fr}.memory{max-height:350px}.flow{display:none}.status{grid-template-columns:1fr;gap:4px}.controls{gap:8px}}
</style></head><body><main data-json-page="cache-explorer"></main><script src="site-data.js" defer></script><script src="cache-explorer.js" defer></script></body></html>
